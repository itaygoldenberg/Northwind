ze="11" font-weight="700">OTHER CHANNELS, SAME API</text><g transform="translate(45 310)"><rect width="342" height="122" rx="14" fill="#ffffff" fill-opacity=".035" stroke="#00ffcc" stroke-opacity=".45"/><circle cx="35" cy="36" r="18" fill="#00ffcc" fill-opacity=".16" stroke="#00ffcc"/><text x="35" y="42" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="750">05</text><text x="25" y="80" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="750">Socket.io</text><text x="25" y="104" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">One open connection, broadcast to every client</text></g><g transform="translate(429 310)"><rect width="342" height="122" rx="14" fill="#ffffff" fill-opacity=".035" stroke="#d1b3ff" stroke-opacity=".45"/><circle cx="35" cy="36" r="18" fill="#d1b3ff" fill-opacity=".16" stroke="#d1b3ff"/><text x="35" y="42" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="750">06</text><text x="25" y="80" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="750">RAG</text><text x="25" y="104" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">Local documents indexed into a vector store</text></g><g transform="translate(813 310)"><rect width="342" height="122" rx="14" fill="#ffffff" fill-opacity=".035" stroke="#00ffcc" stroke-opacity=".45"/><circle cx="35" cy="36" r="18" fill="#00ffcc" fill-opacity=".16" stroke="#00ffcc"/><text x="35" y="42" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="750">07</text><text x="25" y="80" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="750">MCP Server</text><text x="25" y="104" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">Six tools a language model can call</text></g><g transform="translate(45 466)"><rect width="1110" height="58" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#00ffcc" stroke-opacity=".2"/><circle cx="27" cy="29" r="6" fill="#00ffcc"><animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite"/></circle><text x="48" y="35" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14">docker compose up -d --build starts four containers: the client on port 80, the API on port 4000, MySQL and MongoDB.</text></g></svg>
