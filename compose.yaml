name: northwind

# All images and containers:
services:
 
  # MySQL container:
  mysql-service:
 
    # MySQL image:
    image: mysql:8
 
    # Container name:
    container_name: mysql-container
 
    # Restart policy:
    restart: unless-stopped
 
    # Volumes:
    volumes:
      - mysql-volume:/var/lib/mysql
      - ./Database/MySQL:/docker-entrypoint-initdb.d
 
    # Environment variables needed by mysql image:
    environment:
      MYSQL_HOST: localhost
      MYSQL_USER: JohnBryce
      MYSQL_PASSWORD: Pa$$w0rd
      MYSQL_DATABASE: northwind
      MYSQL_ROOT_PASSWORD: Pa$$w0rd
 
    # Healthcheck - constantly check if our service is working well:
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
   
     
# -----------------------------------------------------------------------
 
  # MongoDB container
  mongo-service:
 
    # MongoDB image:
    image: mongo:8
 
    # Container name:
    container_name: mongo-container
 
    # Restart policy:
    restart: unless-stopped
 
    # Volumes:
    volumes:
      - mongo-volume:/data/db
      - ./Database/MongoDB:/docker-entrypoint-initdb.d
 
    # Healthcheck - constantly check if our service is working well:
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
 
# -----------------------------------------------------------------------
 
  # Our backend service:
  backend-service:
 
    # Which other services we're depending on, so wait for them:
    depends_on:
     mysql-service:
       condition: service_healthy
     mongo-service:
       condition: service_healthy
 
    # Our image:
    image: northwind-backend
 
    # Build the image from the following Dockerfile location:
    build: ./Backend
 
    # Our container:
    container_name: northwind-backend
 
    # Port mapping (host-port:container-port):
    ports:
      - 4000:4000
 
    # Restart policy:
    restart: unless-stopped
 
    # Volumes:
    volumes:
      - assets-volume:/app/src/assets
      # The real .env stays on the host and is handed to the container at run time,
      # read-only. It is excluded from the image by Backend/.dockerignore, so the
      # secrets are never baked into the image itself.
      - ./Backend/.env:/app/.env:ro
 
    # These override the .env file: dotenv.config() does not overwrite variables
    # that already exist in process.env, so whatever is set here wins.
    environment:
      MYSQL_HOST: mysql-service # Service name is the name of the vm computer of mysql container.
      MYSQL_USER: JohnBryce
      MYSQL_PASSWORD: Pa$$w0rd
      MYSQL_DATABASE: northwind
      MONGODB_CONNECTION_STRING: mongodb://mongo-service:27017/northwind
      # The seeded users in Database/MySQL/northwind.sql were hashed with this
      # public demo salt, so the demo accounts can sign in. It deliberately
      # differs from the private HASH_SALT in .env, which stays out of the repo.
      HASH_SALT: northwind-demo-salt
 
    # Healthcheck - constantly check if our service is working well:
    healthcheck:
      test: ["CMD", "node", "--eval", "require('http').get('http://localhost:4000/ping', response => process.exit(response.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
 
# -----------------------------------------------------------------------
 
  # Frontend container
  frontend-service:
 
    # Which other services we're depending on, so wait for them:
    depends_on:
      backend-service:
        condition: service_healthy
 
    # Our image:
    image: northwind-frontend
 
    # Build the image from the following Dockerfile location:
    build: ./Frontend
 
    # Our container:
    container_name: northwind-frontend
 
    # Port mapping (host-port:container-port):
    ports:
      - 5173:5173
 
    # Volumes:
    volumes:
      # Vite reads .env from the project root at start up. It is excluded from
      # the image by Frontend/.dockerignore, so it is mounted here read-only.
      - ./Frontend/.env:/app/.env:ro
 
    # Restart policy:
    restart: unless-stopped
 
    # Healthcheck - constantly check if our service is working well:
    healthcheck:
      test: ["CMD", "node", "--eval", "require('http').get('http://localhost:5173', response => process.exit(response.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
 
# -----------------------------------------------------------------------
 
# List of all our named-volumes:
volumes:
  mysql-volume:
  mongo-volume:
  assets-volume:
 